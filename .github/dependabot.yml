version: 2
updates:
  - package-ecosystem: uv
    directory: /
    open-pull-requests-limit: 15
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
